name: Verify SupplyLoop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-supplyloop
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.20.0'
          cache: npm
      - name: Validate public browser configuration
        run: |
          node --input-type=module <<'NODE'
          const url = process.env.VITE_SUPABASE_URL?.trim() ?? ''
          const key = process.env.VITE_SUPABASE_PUBLISHABLE_KEY?.trim() ?? ''
          let validUrl = false
          try {
            validUrl = new URL(url).protocol === 'https:'
          } catch {}
          if (!validUrl || !key.startsWith('sb_publishable_')) {
            throw new Error('Set the repository variables VITE_SUPABASE_URL (HTTPS) and VITE_SUPABASE_PUBLISHABLE_KEY (publishable key only).')
          }
          NODE
      - name: Install locked dependencies
        run: npm ci
      - name: Check types
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Build static site
        run: npm run build
